[package]
name = "jwt-simple"
version = "0.13.0"
description = "Easy to use, secure, non opinionated JWT (JSON Web Tokens) implementation for Rust."
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
rust-version = "1.85"
license = "ISC"
repository = "https://github.com/jedisct1/rust-jwt-simple"
homepage = "https://github.com/jedisct1/rust-jwt-simple"
categories = ["wasm", "api-bindings", "web-programming", "cryptography"]
keywords = ["jwt", "jws", "authentication", "tokens", "json"]
readme = "README.md"
include = ["src/**/*.rs", "benches/**/*.rs", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
anyhow = "1.0.104"
blake2b_simd = "1.0.4"
binstring = "0.1.7"
ciborium = { version = "0.2.2", optional = true }
coarsetime = "0.1.37"
ct-codecs = "1.1.7"
ed25519-compact = { version = "2.3.1", features = ["pem"] }
hmac-sha1-compact = "1.1.7"
hmac-sha256 = { version = "1.1.14", features = ["traits011"] }
hmac-sha512 = { version = "1.1.12", features = ["traits011", "sha384"] }
k256 = { version = "0.14.0", features = ["ecdsa", "std", "pkcs8", "pem"] }
p256 = { version = "0.14.0", features = ["ecdsa", "std", "pkcs8", "pem", "ecdh"] }
p384 = { version = "0.14.0", features = ["ecdsa", "std", "pkcs8", "pem"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
zeroize = "1.9.0"

# For now, superboring is not optional: the current `boring` crate does not implement ML-DSA yet,
# so ML-DSA signatures always use a Rust implementation until a new version of the crate is out.
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
boring = { version = "5.1.0", optional = true }
superboring = "0.1.14"

[target.'cfg(any(target_arch = "wasm32", target_arch = "wasm64"))'.dependencies]
superboring = "0.1.14"

[dev-dependencies]
benchmark-simple = "0.1.10"

[features]
default = ["optimal", "jwe"]
cwt = ["ciborium"]
jwe = []
optimal = ["boring"]
# Note: to emulate boringssl, "default-features = false" is required in addition to "pure-rust".
pure-rust = []
wasi-abi2 = ["coarsetime/wasi-abi2"]
wasi-crypto = ["superboring/wasi-crypto"]

[[bench]]
name = "benchmark"
harness = false

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"

[profile.bench]
codegen-units = 1
